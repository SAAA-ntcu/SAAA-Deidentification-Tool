[package]
name = "saaa-deidentification-tool"
version = "2.0.0"
description = "SAAA 學生學習能力檢測去識別化工具 - 桌面版"
authors = ["SAAA-ntcu"]
edition = "2021"

[lib]
name = "saaa_deidentification_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
