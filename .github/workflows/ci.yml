name: CI - Code Quality & Security Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    name: 語法檢測與敏感資料防護
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 檢查 JavaScript 語法正確性
        run: |
          node -c SAAA去識別化工具/js/app.js
          node -c tauri-app/frontend/js/app.js
          echo "JavaScript syntax check passed!"

      - name: 檢查機密與個資外洩防護 (敏感資料掃描)
        run: |
          # 確保不會誤將包含真實個資的原始評量資料 push 上公開 repo
          if [ -d "01_原始評量資料" ]; then
            echo "::warning title=隱私提醒::偵測到 01_原始評量資料，請確保已在 .gitignore 中排除原始資料，避免外洩至公開 Repository！"
          fi
